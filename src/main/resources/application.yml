spring:
  application:
    name: novamart
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Application configuration
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 900000 # 15 minutes
    refresh-token-expiration: 2592000000 # 30 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    password-reset-expiration: 3600000 # 1 hour
    email-verification-expiration: 86400000 # 24 hours
    otp-expiration: 300000 # 5 minutes
    otp-max-attempts: 3

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
