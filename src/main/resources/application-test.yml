spring:
  datasource:
    url: jdbc:tc:postgresql:16:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

logging:
  level:
    commerce.novamart: INFO

app:
  jwt:
    secret: test-secret-key-for-testing-only-must-be-at-least-256-bits-long
    access-token-expiration: 60000 # 1 minute for testing
    refresh-token-expiration: 120000 # 2 minutes for testing
  cors:
    allowed-origins: http://localhost:3000
  seed:
    enabled: false
  dev:
    expose-tokens: true
