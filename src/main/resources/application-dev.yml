spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/novamart_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true

logging:
  level:
    commerce.novamart: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-this-in-production-must-be-at-least-256-bits}
