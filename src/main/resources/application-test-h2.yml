spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false  # Disable Flyway with H2, use Hibernate DDL instead

logging:
  level:
    commerce.novamart: INFO

app:
  jwt:
    secret: test-secret-key-for-testing-only-must-be-at-least-256-bits-long
    access-token-expiration: 60000 # 1 minute for testing
    refresh-token-expiration: 120000 # 2 minutes for testing
  cors:
    allowed-origins: http://localhost:3000
  seed:
    enabled: false
  dev:
    expose-tokens: true
